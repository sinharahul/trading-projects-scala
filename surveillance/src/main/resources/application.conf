// application.conf — every tunable threshold in one place.
// Tune these after the backtest in Step 8; do not hard-code them in detectors.
surveillance {
  wash-trade {
    window-minutes = 5
    quantity-tolerance = 0.0
    price-tolerance-pct = 0.5
  }
  spoofing {
    min-order-size = 10000
    size-vs-book-multiple = 5.0
    cancel-within-seconds = 10
    min-repetitions-per-hour = 5
    max-fill-ratio = 0.05
  }
  marking-close {
    close-window-minutes = 15
    min-volume-share-pct = 20.0
    min-price-move-pct = 1.0
    min-account-share-pct = 50.0
  }
  unusual-volume {
    lookback-days = 30
    z-threshold = 3.0
    min-volume = 10000
  }
  scoring {
    cooldown-hours = 24
    auto-close-below = 30
    escalate-above = 80
  }
}
