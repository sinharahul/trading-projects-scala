capture {
  kafka {
    bootstrap-servers = "localhost:9092"
    executions-topic = "executions"
    dlq-topic = "trade_dlq"
    group-id = "trade-capture-v1"
    auto-offset-reset = "earliest"
  }
  postgres {
    url = "jdbc:postgresql://localhost:5432/backoffice"
    user = "backoffice"
    password = "backoffice"
  }
  delta {
    warehouse = "/tmp/delta-warehouse"
    validated-table = "validated_trades"
  }
  validation {
    price-tolerance-pct = 5.0
    max-quantity = 10000000
    reject-rate-alert-pct = 10.0
    reject-rate-window-minutes = 15
  }
}
